# Bottega Slack app manifest (issue #12).
#
# Create the app from this file: api.slack.com/apps -> Create New App ->
# From an app manifest -> paste this file -> Create. Then:
#   - Install to your workspace (Settings -> Basic Information -> Install
#     App), copy the Bot User OAuth Token (xoxb-...) into .env as
#     SLACK_BOT_TOKEN.
#   - Create an app-level token (Settings -> Basic Information -> App-Level
#     Tokens -> Generate Token) with the `connections:write` scope and copy
#     it into .env as SLACK_APP_TOKEN. Socket Mode (below) uses it.
# No request URL is needed: Socket Mode delivers events over a websocket.
display_information:
  name: Bottega
  description: "Team agents that live in your chat: pick up work items, implement them, open PRs."
  background_color: "#1a1d21"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
  bot_user:
    display_name: Bottega
    always_online: true
oauth_config:
  scopes:
    bot:
      # Posting agent replies and delivery announcements to channels.
      - chat:write
      # Receiving @mentions of the bot.
      - app_mentions:read
      # Receiving messages in public channels, private channels, and DMs.
      - channels:history
      - groups:history
      - im:history
      # Live-Slack QA canary (issue #79): create/locate the bottega-qa
      # channel, invite bot + QA user, list channels/users.
      - channels:manage
      - channels:read
      - users:read
      # Live-Slack QA canary (issue #81): create/locate the PRIVATE
      # bottega-qa channel (groups:write) and list private channels
      # (groups:read) so an archived one is never revived.
      - groups:write
      - groups:read
      # conversations.open for the QA user's DM.
      - im:write
    user:
      # Live-Slack QA canary (issue #79): the QA user token sends messages
      # as the QA user (chat:write) and reads back bot replies
      # (im:history/channels:history); conversations.list for the channel.
      - chat:write
      - channels:history
      - channels:read
      - groups:history
      - im:history
      - im:write
      - users:read
      - im:history
      - im:write
      - users:read
settings:
  # Interactive components (approval buttons, issue #44): block_actions need
  # interactivity enabled. Socket Mode delivers the payloads over the same
  # websocket — no request URL is needed.
  interactivity:
    is_enabled: true
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - message.im
      - app_mention
  socket_mode_enabled: true
  token_rotation_enabled: false

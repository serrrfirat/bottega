# Local-dev overrides (issues #123, #126, #143, #301): `bun run dev`
# (scripts/dev.sh) mounts the DEV-PERMISSIVE egress config
# (config/egress.dev.yml, generated by src/egress/generate.ts — allow-all
# allowlist "*" + no judge, secrets + management kept) into the dev proxy
# while making it host-reachable and giving it the host's gitignored data
# dir, so the boundary's secret files are what the proxy injects. The
# STRICT config/egress.yml stays the deployment contract — the base
# docker-compose.yml still mounts it for the deployed stack; this override
# replaces the volume list for the dev proxy only.
#
# Issue #301 — the dev stack is SHARED across worktrees: scripts/dev.sh
# exports COMPOSE_PROJECT_NAME=(canonical checkout basename) so every
# worktree targets ONE project -> ONE egress network (reuse, no subnet
# overlap) and ONE proxy/broker container set. That requires a stable
# /data bind too, so dev.sh exports BOTTEGA_DEV_DATA_DIR=shared_data_dir
# (the canonical store) and each bind below interpolates it; bare
# `docker compose` use (docs/troubleshooting) falls back to ./data.
#
# The auth-broker vault (issue #143) is published for the dev server the
# same way: its token bootstraps to the HOST's ./data/.omp/auth-broker.token
# (0600, entrypoints/broker.sh) and it listens on 127.0.0.1:8765, so
# scripts/dev.sh can export OMP_AUTH_BROKER_URL/TOKEN for the extension
# runtime's broker secret resolver. The base service's image, entrypoint,
# command, healthcheck, and environment all stay inherited.
#
# Used only by scripts/dev.sh:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d iron-proxy auth-broker
# The base docker-compose.yml stays unchanged: NO published ports in
# deployment, and the named `data` volume stays the compose contract.
#
# Ports bind to 127.0.0.1 only — neither the egress gate nor the vault
# ever leaves this host:
#   - 8080: the tunnel listener (HTTP_PROXY/HTTPS_PROXY of the dev server)
#   - 9092: the management API (the boundary's POST /v1/reload, bearer
#     token IRON_MANAGEMENT_API_KEY set by dev.sh)
#   - 8765: the auth-broker vault (the boundary's secret fetch,
#     OMP_AUTH_BROKER_URL/TOKEN exported by dev.sh)
# The override replaces the volume list: config + CA mounts match the base
# service, and `data:/data` becomes the host's canonical data dir — the dev
# server writes secret files to data/proxy-secrets (PROXY_SECRETS_DIR) and the
# generated dev egress config reads them at /data/proxy-secrets
# (PROXY_SECRETS_MOUNT_PATH), the same relative path; the broker token
# lands at data/.omp/auth-broker.token (the same ./data bind).
services:
  iron-proxy:
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9092:9092"
    volumes:
      - ./config/egress.dev.yml:/etc/iron-proxy/egress.yml:ro
      - ./certs:/etc/iron-proxy/certs:ro
      - ${BOTTEGA_DEV_DATA_DIR:-./data}:/data

  auth-broker:
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      # Replaces the base named `data:/data` with the host's data bind for
      # the dev broker (compose merges volumes by container path): the vault
      # state + token live in the host's gitignored data/ dir, readable by
      # dev.sh. scripts/dev.sh exports BOTTEGA_DEV_DATA_DIR=shared_data_dir
      # (issue #301) so every worktree's shared dev stack binds the SAME
      # canonical data/; the `:-./data` fallback keeps bare compose runs on
      # ./data. The base `./config/entrypoints:/entrypoints:ro` mount is
      # inherited unchanged (the token bootstrap runs from it).
      - ${BOTTEGA_DEV_DATA_DIR:-./data}:/data

# Bottega egress topology (issue #8): iron-proxy is the single egress gate.
# All outbound traffic from `server` and `executor` crosses iron-proxy:
#   - DNS resolves every name to the proxy (compose `dns:`) — default-deny
#     routing; the allowlist transform 403s anything not configured.
#   - HTTP_PROXY/HTTPS_PROXY route tools that honor proxy env (Bun fetch
#     included — verified in src/egress/proxy-env.test.ts) through the
#     proxy's tunnel listener.
#   - NO_PROXY keeps loopback and the auth services off the proxy (server
#     -> broker/gateway traffic is internal; "data" is kept for legacy
#     local setups that resolve it as a hostname).
# No ports are published: everything lives on the internal `egress` network.
#
# Per-job isolation topology (issue #105): a second, INTERNAL-only `sandbox`
# network (172.31.0.0/24, `internal: true` — no route to the host or WAN)
# hosts the disposable per-job job containers, which attach ONLY there, never
# `egress`. iron-proxy is dual-homed (egress 172.30.0.2 + sandbox 172.31.0.2):
# inside the sandbox it is the job containers' DNS sinkhole and their only
# external seam via the HTTP(S) proxy tunnel + allowlist. Auth-broker,
# auth-gateway, and mem0 are dual-homed so job containers can resolve them
# over NO_PROXY while the server/executor keep their egress paths. The server
# and executor themselves are NOT on the sandbox network.
#
# Credential boundary (issue #9): auth-broker is the credential vault
# (OMP), auth-gateway fronts it for OpenAI-compatible clients. Both are
# internal-only and keep their state on the `data` volume. Provider keys
# live in the vault; channel tokens live in the project .env only — the
# executor env carries no keys, no tokens, no PAT.
services:
  egress-config-init:
    # Copies the reviewed generated policy into the shared mutable location.
    # The credential boundary rewrites only its marked call-scoped region;
    # every stack start removes stale/replayed authority from a prior process.
    image: alpine:3.19
    command:
      - sh
      - -c
      - cp /seed/egress.yml /data/egress.yml && chmod 600 /data/egress.yml
    volumes:
      - ./config/egress.yml:/seed/egress.yml:ro
      - data:/data
    networks:
      - egress

  iron-proxy:
    # Pinned stable release; published to Docker Hub only (ghcr.io does not
    # exist — see .goreleaser.yml in ironsh/iron-proxy). v0.49.0 is the
    # latest stable tag at implementation time.
    image: ironsh/iron-proxy:0.49.0
    restart: on-failure
    depends_on:
      egress-config-init:
        condition: service_completed_successfully
    command:
      - "-config"
      - "/data/egress.yml"
    environment:
      # LLM judge key (config/egress.yml -> judge.provider.api_key_env):
      # the judge gates allowlisted traffic, so without a key every
      # allowlisted request fails the judge and is denied (fail closed).
      # Set it in .env; the proxy reads it from its own environment.
      NEARAI_JUDGE_API_KEY: ${NEARAI_JUDGE_API_KEY:-}
      # Management API token (config/egress.yml -> management.api_key_env,
      # issue #123): the server's extension credential boundary calls
      # POST /v1/reload with this bearer token after writing each secret
      # file, so credential rotation applies without a proxy restart. Set
      # it in .env to enable reloads; empty → the server keeps the
      # write-only boundary (the management endpoint 401s anyway).
      IRON_MANAGEMENT_API_KEY: ${IRON_MANAGEMENT_API_KEY:-}
    volumes:
      - ./config/egress.yml:/seed/egress.yml:ro
      # MITM CA, generated once per deployment (gitignored):
      #   docker run --rm -v $PWD/certs:/certs ironsh/iron-proxy:0.49.0 generate-ca -outdir /certs
      - ./certs:/etc/iron-proxy/certs:ro
      # Audit: every request is logged as one JSON line to the proxy's
      # stdout/stderr (docker compose logs iron-proxy). A log shipper can
      # write data/egress/*.jsonl from there; v1 rotates nothing.
      - data:/data
    networks:
      egress:
        ipv4_address: 172.30.0.2
      # Dual-homed (issue #105): the sandbox network is the ONLY external
      # seam for job containers. Its fixed sandbox IP is the job containers'
      # DNS sinkhole + proxy tunnel endpoint, so the proxy mediates every job
      # egress while the egress network keeps serving the server/executor.
      sandbox:
        ipv4_address: 172.31.0.2

  auth-broker:
    # Credential vault (issue #9): OMP auth-broker, the only writer of
    # provider credentials. Official OMP runtime image; `dev` is the
    # published tag at implementation time — pin a release tag once one is
    # published. Broker/gateway traffic to real providers (OAuth refresh,
    # gateway dispatch) is NOT routed through iron-proxy: the #8 allowlist
    # covers model endpoints only, so these services keep default egress.
    image: oh-my-pi/pi:dev
    restart: on-failure
    # Bootstrap script generates the bearer token into the shared data
    # volume (0600) on first boot, then execs omp auth-broker serve.
    entrypoint:
      - /entrypoints/broker.sh
    command:
      - auth-broker
      - serve
      - --bind=0.0.0.0:8765
    environment:
      # Config dir on the data volume: token + SQLite vault survive
      # container recreation and are shared with the gateway.
      PI_CONFIG_DIR: /data/.omp
    volumes:
      - ./config/entrypoints:/entrypoints:ro
      - data:/data
    healthcheck:
      # /v1/healthz is the only unauthenticated broker endpoint; the token
      # file exists before serve starts (entrypoint), so healthy implies
      # the token is ready for dependents.
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:8765/v1/healthz
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - egress
      # Dual-homed (issue #105): also reachable on the internal sandbox
      # network so job containers can resolve it via NO_PROXY (extension
      # credential fetches must bypass the proxy allowlist, which would 403
      # the internal vault). Retains egress for the server/executor's own
      # broker-mode traffic.
      - sandbox

  auth-gateway:
    # Forward proxy over the broker (issue #9): OpenAI/Anthropic/pi-native
    # wire formats resolved against vault credentials. Starts only after the
    # broker is healthy so its token file is guaranteed on the shared volume.
    image: oh-my-pi/pi:dev
    restart: on-failure
    depends_on:
      auth-broker:
        condition: service_healthy
    command:
      - auth-gateway
      - serve
      - --bind=0.0.0.0:4000
    environment:
      OMP_AUTH_BROKER_URL: http://auth-broker:8765
      # The gateway is itself a broker client: with the same PI_CONFIG_DIR
      # on the shared volume it resolves the broker token from
      # /data/.omp/auth-broker.token automatically (no env token needed).
      PI_CONFIG_DIR: /data/.omp
    volumes:
      - data:/data
    networks:
      - egress
      # Dual-homed (issue #105): job containers resolve the gateway via
      # NO_PROXY on the internal sandbox network; the server/executor keep
      # reaching it on egress.
      - sandbox

  mem0:
    # Memory backend (issue #43): self-hosted mem0 OSS REST server. Pinned to
    # `latest` — Docker Hub publishes only that tag for mem0/mem0-api-server
    # at implementation time; the mem0 client's docker leg uses the same tag
    # (src/memory/mem0.test.ts). The OSS server's embedder/extractor needs an
    # LLM key at boot (crashes with "api_key client option must be set"
    # without one), so OPENAI_API_KEY is passed through from the project .env
    # (fail-closed: without it the container won't boot).
    image: mem0/mem0-api-server:latest
    restart: on-failure
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    networks:
      - egress
      # Dual-homed (issue #105): job containers resolve mem0 via NO_PROXY
      # on the internal sandbox network (memory backend calls bypass the
      # proxy allowlist); the server keeps reaching it on egress.
      - sandbox

  server:
    # App image built from the repo root (Dockerfile): the server and the
    # executor share it and differ only in entrypoint. BOTTEGA_IMAGE_TAG
    # pins a known-good build (rollback: set it to the previous tag).
    build:
      context: .
    image: bottega:${BOTTEGA_IMAGE_TAG:-local}
    entrypoint:
      - "bun"
      - "run"
      - "src/server/index.ts"
    restart: on-failure
    depends_on:
      - iron-proxy
    dns:
      - 172.30.0.2 # iron-proxy: DNS allowlist enforcement (anti-tunneling)
    environment:
      HTTP_PROXY: http://iron-proxy:8080
      HTTPS_PROXY: http://iron-proxy:8080
      # The MITM CA (iron-proxy terminates TLS with it, config/egress.yml
      # -> tls): Bun/Node fetch verify the proxy's leaf certs against this
      # CA — without it every HTTPS egress through the tunnel fails TLS.
      # The same certs/ dir the proxy mounts; generated once per deployment
      # (gitignored).
      NODE_EXTRA_CA_CERTS: /etc/iron-proxy/certs/ca.crt
      # auth-broker/auth-gateway/mem0 are internal names: broker-mode traffic
      # and memory-backend calls must bypass the proxy (the allowlist would
      # 403 them).
      NO_PROXY: localhost,127.0.0.1,data,auth-broker,auth-gateway,mem0
      # Credential boundary (issue #123): the extension runtime reloads the
      # proxy (POST /v1/reload) after writing each secret file, so rotation
      # applies immediately. Both the URL and the token must be set — the
      # server only wires the reload when both are non-empty (unset →
      # write-only boundary, no reload).
      BOTTEGA_PROXY_CONTROL_URL: http://iron-proxy:9092
      BOTTEGA_PROXY_CONTROL_TOKEN: ${IRON_MANAGEMENT_API_KEY:-}
      BOTTEGA_PROXY_CONFIG_PATH: /app/data/egress.yml
      # Credential boundary (issue #9): model keys resolve through the
      # broker, not from env. OMP_AUTH_BROKER_TOKEN is copied into .env
      # from the broker's first-boot token on the data volume
      # (/data/.omp/auth-broker.token, 0600). Broker mode is fail-closed:
      # URL set with no token aborts at first credential resolution.
      OMP_AUTH_BROKER_URL: ${OMP_AUTH_BROKER_URL:-http://auth-broker:8765}
      OMP_AUTH_BROKER_TOKEN: ${OMP_AUTH_BROKER_TOKEN:-}
      # Memory backend (issue #135): compose deployments default to the
      # internal mem0 service. An explicit project .env value can point at a
      # different server. Local development does not load this compose env,
      # so its unset settings continue to select SQLite.
      MEM0_BASE_URL: ${MEM0_BASE_URL:-http://mem0:8000}
      # Optional secret: the OSS server only demands it when auth is enabled.
      MEM0_API_KEY: ${MEM0_API_KEY:-}
    volumes:
      # The app resolves its store/sessions/transcripts from the relative
      # path data/ (WORKDIR /app) — the shared volume mounts there.
      - data:/app/data
      # OMP agent config per deployment: templates from config/omp/ (issue
      # #9), writable so the SDK can persist its placeholder key alongside.
      - ./config/omp:/app/data/omp-agent
      # The egress MITM CA (NODE_EXTRA_CA_CERTS above): the proxy's leaf
      # certs verify against it, so HTTPS egress through the tunnel works.
      - ./certs:/etc/iron-proxy/certs:ro
    networks:
      - egress

  executor:
    # Work-item runner (issue #11): same image as the server, different
    # entrypoint. Claims open work items, runs one agent session per item in
    # a fresh workspace (data:/workspaces), pushes bottega/<id> branches and
    # opens PRs through the GitHub API. The git PAT is read from a FILE on
    # the data volume (/app/data/secrets/github-pat, mode 0600) — the executor
    # env carries no keys, tokens, or PATs (credential boundary, issue #9).
    profiles:
      - executor
    build:
      context: .
    image: bottega:${BOTTEGA_IMAGE_TAG:-local}
    entrypoint:
      - "bun"
      - "run"
      - "src/executor.ts"
    restart: on-failure
    # Issue #105 reachable hardening: immutable image root, no Linux
    # capabilities, Docker's default seccomp allowlist, bounded PIDs, and an
    # init process that reaps sandbox descendants. The only writable mounts
    # are durable SQLite state and disposable workspaces below.
    read_only: true
    init: true
    pids_limit: 256
    mem_limit: 1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      - iron-proxy
    dns:
      - 172.30.0.2 # iron-proxy: DNS allowlist enforcement (anti-tunneling)
    environment:
      HTTP_PROXY: http://iron-proxy:8080
      HTTPS_PROXY: http://iron-proxy:8080
      # The egress MITM CA (same reasoning as the server service): without
      # it the executor's HTTPS egress through the tunnel fails TLS.
      NODE_EXTRA_CA_CERTS: /etc/iron-proxy/certs/ca.crt
      NO_PROXY: localhost,127.0.0.1,data,auth-broker,auth-gateway
      # Credential boundary (issue #9): the executor env carries NO provider
      # keys, channel tokens, or PATs — credentials resolve through the
      # broker at request time (git auth via the PAT file, #11).
      OMP_AUTH_BROKER_URL: ${OMP_AUTH_BROKER_URL:-http://auth-broker:8765}
      OMP_AUTH_BROKER_TOKEN: ${OMP_AUTH_BROKER_TOKEN:-}
      # Workspaces + git credentials live on the data volume. The workspaces
      # dir is an org setting (settings.workspaces_dir, issue #67); unset it
      # resolves to the container default /workspaces (mounted below).
      EXECUTOR_GIT_TOKEN_FILE: /app/data/secrets/github-pat
      # Related only to extension jobs: the supervisor passes this FILE
      # mount to that child kind, never the bearer value or other jobs.
      OMP_AUTH_BROKER_TOKEN_FILE: /app/data/.omp/auth-broker.token
      # Per-job container isolation (issue #101/#338): the supervisor retains
      # the real Store (single-writer on the shared `data` volume) and exposes
      # ONLY job-scoped store/memory ops to each disposable job container over
      # a bounded unix-socket RPC. The supervisor mounts the host docker socket
      # to launch one container per claimed job. Each job container mounts ONLY
      # its own workspace subdir, its own transcript subdir, the RPC socket
      # dir, the egress MITM CA, and the exact kind-authorized credential
      # subdir — NEVER the whole shared `data` volume and NEVER a SQLite file.
      # Job egress (issue #105): each job container joins ONLY the internal
      # `sandbox` network — never egress — so direct-IP internet bypass is
      # impossible; DNS inside the sandbox resolves through iron-proxy's
      # sandbox IP (sinkhole) and HTTP(S) egress traverses the proxy's
      # allowlist tunnel. The CA is bind-mounted read-only.
      BOTTEGA_SANDBOX_DATA_VOLUME: data
      # The supervisor-visible TRANSCRIPT dir: the app's default relative
      # `data/transcripts` resolves inside the /app/data volume mount, so the
      # absolute production path is /app/data/transcripts. It is pinned here
      # explicitly (and the runner resolves a relative fallback against
      # BOTTEGA_SANDBOX_STATE_VOLUME_ROOT) so volume-subpath mounts compute
      # the exact per-job transcripts/<itemId> subpath (issue #101).
      BOTTEGA_SANDBOX_TRANSCRIPTS_HOST: /app/data/transcripts
      # The supervisor-visible paths where the shared `data` volume root is
      # mounted for the workspaces axis (`/workspaces`) and the state axis
      # (`/app/data`) — used to compute per-job `volume-subpath` mounts so a
      # job container sees only its own subdirectories.
      BOTTEGA_SANDBOX_WORKSPACES_VOLUME_ROOT: /workspaces
      BOTTEGA_SANDBOX_STATE_VOLUME_ROOT: /app/data
      # The internal-only `sandbox` compose network (actual Docker name
      # `<project>_sandbox`; `bottega` is the deployment project name) and
      # iron-proxy's fixed sandbox IP — the job containers' DNS sinkhole and
      # the only external seam. Job containers NEVER join `egress`.
      BOTTEGA_SANDBOX_NETWORK: ${BOTTEGA_SANDBOX_NETWORK:-bottega_sandbox}
      BOTTEGA_SANDBOX_DNS: 172.31.0.2
      BOTTEGA_SANDBOX_PROXY_URL: http://iron-proxy:8080
      # Host-visible path to the egress MITM CA (the executor binds ./certs
      # at /etc/iron-proxy/certs; the host sibling needs the host path so the
      # job container can verify proxied TLS). Override for remote hosts.
      BOTTEGA_SANDBOX_CA_CERT_HOST: ${BOTTEGA_SANDBOX_CA_CERT_HOST:-${PWD}/certs/ca.crt}
      # The job container preserves only the allowlisted passthrough names;
      # it never receives Slack tokens or the raw parent environment — the
      # RPC store surface (explicit allowlist) is its only data path.
      BOTTEGA_SANDBOX_DOCKER_SOCKET: /var/run/docker.sock
    volumes:
      - data:/app/data
      - data:/workspaces
      # Docker-out-of-Docker: the supervisor drives the host daemon to launch
      # the disposable per-job containers. The job containers never receive
      # this socket (it is only mounted into the supervisor).
      - /var/run/docker.sock:/var/run/docker.sock
      # The egress MITM CA (NODE_EXTRA_CA_CERTS above).
      - ./certs:/etc/iron-proxy/certs:ro
    networks:
      - egress

volumes:
  # The shared `data` volume: single-writer SQLite store + secrets + transcripts
  # + workspaces. Named `data` (not the compose-default `<project>_data`) so the
  # executor's sibling per-job containers (Docker-out-of-Docker) can mount exact
  # per-job SUBPATHS of it by name via `--mount type=volume,volume-subpath=…`
  # (BOTTEGA_SANDBOX_DATA_VOLUME). The job containers never mount the whole root.
  data:
    name: data

networks:
  # The only network with a route out of the host: services that need real
  # egress (server, executor, the auth services' own provider calls, and the
  # proxy's upstream) live here, and their DNS resolves through iron-proxy
  # (default-deny allowlist).
  egress:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  # Per-job container isolation (issue #105): an INTERNAL-only bridge with no
  # route to the host or the external world. Job containers attach ONLY here
  # — never egress — so direct-IP internet bypass is impossible. DNS inside
  # the sandbox resolves through iron-proxy's sandbox IP (sinkhole); HTTP(S)
  # egress traverses the proxy's allowlist tunnel, the only seam out.
  sandbox:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24

# Model catalog for a bottega deployment (issue #9, fixed #36, #208).
# Loaded by the OMP SDK from the agent dir (data/omp-agent); this file is
# the per-deployment template, mounted from config/omp/ by compose.
#
# CREDENTIALS LIVE AT iron-proxy (issue #208): every provider below sends
# the SAME placeholder bearer (bottega-proxy-placeholder) and points its
# baseUrl at the real gateway; iron-proxy (config/egress.yml — the
# generated `secrets` transform) swaps the real key at egress. The app
# process never holds a live key. The proxy's keys are seeded at boot by
# the credential sync (src/extensions/proxy-seed.ts) from the vault /
# env / the macOS Keychain (dev.sh), and a missing proxy key fails the
# call closed (502) — the placeholder never reaches a gateway.
#
# NEAR AI Cloud (OpenAI-compatible gateway):
#   https://docs.near.ai/cloud/guides/openai-compatibility/
# NOTE: api.near.ai (Developer Hub / Completions) was retired 2025-10-31;
# the live gateway is cloud-api.near.ai/v1. The openai + anthropic entries
# below are the same shape: custom openai-completions providers, each
# declaring one anchor model and probed for its full live catalog by
# listAvailableModels (issue #194 pattern).
providers:
  # Primary model (issue #37, pinned #78): deepseek-v4-flash via the
  # built-in opencode-go provider. The entry is deliberately KEY-ONLY:
  # opencode-go is a built-in SDK catalog provider (deepseek-v4-flash
  # ships there with its transport metadata), and the SDK's models.yml
  # validation treats any provider declaration as CUSTOM — redeclaring
  # its models without a baseUrl fails the boot guard. The pin lives in
  # config.yml (modelRoles.default), so the session can never silently
  # shift to the provider catalog default (kimi-k2.7-code). The key is
  # the proxy placeholder (#208): the proxy injects the real opencode key
  # at egress.
  opencode-go:
    apiKey: bottega-proxy-placeholder
  # Default model (issue #213): the NEAR AI Cloud gateway serves
  # deepseek-ai/DeepSeek-V4-Flash WITHOUT reasoning_content (fast, verified
  # live) — GLM-5.1-FP8's verbose chain-of-thought was the latency problem
  # this swap fixes. opencode-go stays the preferred primary once its
  # monthly quota recovers (#213); only the default role moved. The entry
  # keeps its shape: one anchor + live-catalog probe via listAvailableModels
  # (issue #194) — no reasoning/thinking config here (the gateway serves
  # this model without a thinking block).
  near:
    api: openai-completions
    baseUrl: "https://cloud-api.near.ai/v1"
    apiKey: bottega-proxy-placeholder
    models:
      - id: deepseek-ai/DeepSeek-V4-Flash
        name: DeepSeek V4 Flash via NEAR AI Cloud
        contextWindow: 128000
        maxTokens: 8192
  # Codex (ChatGPT subscription, issue #214): the ChatGPT Codex endpoint
  # (chatgpt.com/backend-api/codex/responses) authenticated with the
  # SUBSCRIPTION OAuth access token from the Codex CLI auth file
  # (~/.codex/auth.json, CODEX_AUTH_PATH override — the filesystem
  # credential is seeded to the proxy at boot, src/extensions/proxy-seed).
  # The entry is deliberately KEY-ONLY, the opencode-go pattern: openai-codex
  # is a BUILT-IN SDK catalog provider (gpt-5.6-luna — the default role,
  # config.yml modelRoles.default — plus gpt-5.4/gpt-5.5/... ship there
  # with their transport metadata — api openai-codex-responses, baseUrl
  # https://chatgpt.com/backend-api, and the native wire contract the codex
  # backend demands: stream:true + store:false REQUIRED, max_output_tokens
  # REJECTED, input MUST be a list — the transport enforces all of it), and
  # the SDK's models.yml validation treats any provider declaration as
  # CUSTOM — redeclaring its models without a baseUrl fails the boot guard.
  # The key is the proxy placeholder (#208): the seed owns the codex refresh
  # (issue #230) and writes the minted ACCESS token to
  # data/proxy-secrets/openai-codex.secret at egress (the static secrets
  # transform entry — the app process never holds the live token, and the
  # proxy never touches auth.openai.com).
  openai-codex:
    apiKey: bottega-proxy-placeholder
  # OpenAI (ChatGPT): direct OpenAI-compatible gateway. Same pattern as
  # near — one declared anchor model for the boot guard + fail-closed
  # fallback; listAvailableModels probes GET /v1/models with the provider's
  # resolved key and merges the LIVE catalog under this provider.
  openai:
    api: openai-completions
    baseUrl: "https://api.openai.com/v1"
    apiKey: bottega-proxy-placeholder
    models:
      - id: gpt-5-mini
        name: GPT-5 Mini
        contextWindow: 400000
        maxTokens: 128000
  # Anthropic (Claude): OpenAI-compatible endpoint on the same host
  # (docs.anthropic.com/en/api/openai-sdk). Same declared-anchor + probe
  # pattern as near/openai.
  anthropic:
    api: openai-completions
    baseUrl: "https://api.anthropic.com/v1"
    apiKey: bottega-proxy-placeholder
    models:
      - id: claude-sonnet-4-5
        name: Claude Sonnet 4.5
        contextWindow: 200000
        maxTokens: 64000
# Add more model ids here as the org needs them (docs.near.ai/cloud/models,
# platform.openai.com/docs/models, docs.anthropic.com/en/docs/about-claude/models).
# Alternative agent cores are supported by the driver seam (issue #17): the
# opencode-go runtime is the second engine option; the same models.yml shape
# applies to it.

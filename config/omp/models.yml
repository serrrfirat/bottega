# Model catalog for a bottega deployment (issue #9, fixed #36).
# Loaded by the OMP SDK from the agent dir (data/omp-agent); this file is
# the per-deployment template, mounted from config/omp/ by compose.
#
# NEAR AI Cloud (OpenAI-compatible gateway):
#   https://docs.near.ai/cloud/guides/openai-compatibility/
# NOTE: api.near.ai (Developer Hub / Completions) was retired 2025-10-31;
# the live gateway is cloud-api.near.ai/v1. The key is referenced by env
# var name: the SDK resolves NEAR_API_KEY from the server process env
# (set in .env or via the Keychain dev loader). The key value never appears
# in this file, agent config, or transcripts.
# The openai + anthropic entries below are the same shape: custom
# openai-completions providers keyed by env var name (OPENAI_API_KEY /
# ANTHROPIC_API_KEY), each declaring one anchor model and probed for its
# full live catalog by listAvailableModels (issue #194 pattern).
providers:
  # Primary model (issue #37, pinned #78): deepseek-v4-flash via the
  # built-in opencode-go provider. Key from env/Keychain (service:
  # bottega-opencode). The entry is deliberately KEY-ONLY: opencode-go is a
  # built-in SDK catalog provider (deepseek-v4-flash ships there with its
  # transport metadata), and the SDK's models.yml validation treats any
  # provider declaration as CUSTOM — redeclaring its models without a
  # baseUrl fails the boot guard. The pin lives in config.yml
  # (modelRoles.default), so the session can never silently shift to the
  # provider catalog default (kimi-k2.7-code).
  opencode-go:
    apiKey: OPENCODE_API_KEY
  # Fallback: NEAR AI Cloud gateway (issue #36). Used when no opencode key
  # is configured.
  near:
    api: openai-completions
    baseUrl: "https://cloud-api.near.ai/v1"
    apiKey: NEAR_API_KEY
    models:
      - id: zai-org/GLM-5.1-FP8
        name: GLM 5.1 FP8 via NEAR AI Cloud
        contextWindow: 128000
        maxTokens: 8192
  # OpenAI (ChatGPT): direct OpenAI-compatible gateway. Same pattern as
  # near — one declared anchor model for the boot guard + fail-closed
  # fallback; listAvailableModels probes GET /v1/models with the provider's
  # resolved key and merges the LIVE catalog under this provider.
  openai:
    api: openai-completions
    baseUrl: "https://api.openai.com/v1"
    apiKey: OPENAI_API_KEY
    models:
      - id: gpt-5-mini
        name: GPT-5 Mini
        contextWindow: 400000
        maxTokens: 128000
  # Anthropic (Claude): OpenAI-compatible endpoint on the same host
  # (docs.anthropic.com/en/api/openai-sdk). Same declared-anchor + probe
  # pattern as near/openai.
  anthropic:
    api: openai-completions
    baseUrl: "https://api.anthropic.com/v1"
    apiKey: ANTHROPIC_API_KEY
    models:
      - id: claude-sonnet-4-5
        name: Claude Sonnet 4.5
        contextWindow: 200000
        maxTokens: 64000
# Add more model ids here as the org needs them (docs.near.ai/cloud/models,
# platform.openai.com/docs/models, docs.anthropic.com/en/docs/about-claude/models).
# Alternative agent cores are supported by the driver seam (issue #17): the
# opencode-go runtime is the second engine option; the same models.yml shape
# applies to it.

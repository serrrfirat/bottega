# OMP agent settings for a bottega deployment (issue #9).
# Loaded by the OMP SDK from the agent dir (data/omp-agent) at boot; this
# file is the per-deployment template, mounted from config/omp/ by compose.
secrets:
  enabled: true
# Default model role (issue #78, re-pinned #213, re-pinned #214): pinned so
# the session never silently shifts to a provider catalog default
# (kimi-k2.7-code) when the catalog updates. The default is the ChatGPT
# subscription Codex provider's CHEAP model — openai-codex/gpt-5.6-luna
# ($0.2 in / $1.2 out per M tokens vs gpt-5.4's $2.5/$15; the user's
# subscription OAuth token from the Codex CLI auth file, see features.md →
# "BYO Codex (ChatGPT subscription)"). The NEAR fallback
# (near/deepseek-ai/DeepSeek-V4-Flash — served without reasoning_content,
# verified live) and the opencode-go primary stay in the catalog as
# documented fallbacks: the operator re-pins `default:`
# near/deepseek-ai/DeepSeek-V4-Flash or opencode-go/deepseek-v4-flash when
# no Codex credential is provisioned (missing credential → the codex
# provider 502s fail-closed at the proxy until the user logs in with the
# Codex CLI).
modelRoles:
  default: openai-codex/gpt-5.6-luna
# approvalMode is deliberately unset: the policy extension (issue #6) owns
# tool-call gating (tier x space policy -> allow | deny | ask-human), so
# OMP's own approval prompts stay off.
# auth.broker.url / auth.broker.token are NOT set here: the server resolves
# the broker from OMP_AUTH_BROKER_URL / OMP_AUTH_BROKER_TOKEN (compose .env),
# keeping the broker token out of the committed templates.

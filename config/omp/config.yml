# OMP agent settings for a bottega deployment (issue #9).
# Loaded by the OMP SDK from the agent dir (data/omp-agent) at boot; this
# file is the per-deployment template, mounted from config/omp/ by compose.
secrets:
  enabled: true
# Automatic durable-fact extraction from human conversation bursts (#133).
# Invalid values disable extraction; omit this block to keep the true default.
learning:
  auto_extract: true
# Default model role (issue #78): pinned so the session never silently
# shifts to the opencode-go provider's catalog default (kimi-k2.7-code)
# when the catalog updates. When no opencode key is configured the model
# is unavailable and the SDK falls back to the first available provider
# (NEAR AI Cloud) — the #36 fallback design is preserved.
modelRoles:
  default: opencode-go/deepseek-v4-flash
# approvalMode is deliberately unset: the policy extension (issue #6) owns
# tool-call gating (tier x space policy -> allow | deny | ask-human), so
# OMP's own approval prompts stay off.
# auth.broker.url / auth.broker.token are NOT set here: the server resolves
# the broker from OMP_AUTH_BROKER_URL / OMP_AUTH_BROKER_TOKEN (compose .env),
# keeping the broker token out of the committed templates.

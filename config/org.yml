# Org repo config for the executor (issue #11, #47).
#
# DEFAULT/FALLBACK file (issue #67): the org settings blob (DB, via the
# settings tool) is the source of truth — when settings set `repos`,
# `git_base_url`, or `api_base_url`, the file's values are overridden.
# Without settings, this file is what the executor uses.
#
# `git_base_url` is where the executor clones each work item's workspace
# from and pushes a bottega/<id> branch to; `api_base_url` (settings only,
# default https://api.github.com) is where PRs are opened — point it at a
# self-hosted GitHub instance or the emulate.dev emulator in tests.
#
# `repos` is an ALLOWLIST, not a routing table (issue #47): the repo a work
# item runs in comes from the CONVERSATION — the agent derives it from what
# the requester said and org memory (e.g. an org-scope memory entry "our
# repos are acme/sandbox, acme/tooling"), and passes it to create_work_item.
# The executor refuses anything not listed here, whatever the conversation
# said. An empty list means no pushes until a repo is configured.
git_base_url: "https://github.com"
repos:
  - "acme/sandbox"

# Org repo config for the executor (issue #11).
#
# The executor clones each work item's workspace from `git_base_url`,
# pushes a bottega/<id> branch, and opens a PR (base: main) on the GitHub
# API at EXECUTOR_GITHUB_API_URL (default https://api.github.com; point it
# at a self-hosted GitHub instance or the emulate.dev emulator in tests).
#
# `repos` lists the repositories work items run in — v1 uses the first
# valid entry. EXECUTOR_REPOS (comma-separated "owner/repo") overrides.
git_base_url: "https://github.com"
repos:
  - "acme/sandbox"

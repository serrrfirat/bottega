name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
          cache: true
      - run: bun install --frozen-lockfile
      - run: bun check
      - run: bun test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose file is valid
        run: docker compose --profile executor config -q

      - name: Build app image
        run: docker build -t bottega:ci .

      # Tools image (issue #58): built here in the docker job — NOT in the
      # fast `ci` job — so the default check/test path stays under 5 min.
      # The docker job is the only place an image is needed, and the build
      # is layer-cached within the run; pushing/pulling a cached build from
      # a registry is a deploy issue (delivery), not this job's concern.
      - name: Build tools image
        run: docker build -f Dockerfile.tools -t bottega-tools:ci .

      - name: Tools image ships the curated CLI set v1
        run: |
          docker run --rm bottega-tools:ci sh -c \
            'gh --version && jq --version && curl --version && git --version' \
            >/dev/null

      - name: Server fails closed without Slack tokens
        run: |
          set +e
          output="$(docker run --rm bottega:ci bun run src/server/index.ts 2>&1)"
          status=$?
          echo "$output"
          [ "$status" -ne 0 ] || { echo "expected non-zero exit, got $status"; exit 1; }
          grep -q "SLACK_APP_TOKEN and SLACK_BOT_TOKEN are required" <<<"$output" \
            || { echo "expected fail-closed message, got: $output"; exit 1; }

      - name: Executor fails closed without PAT file
        run: |
          set +e
          output="$(docker run --rm bottega:ci bun run src/executor.ts 2>&1)"
          status=$?
          echo "$output"
          [ "$status" -ne 0 ] || { echo "expected non-zero exit, got $status"; exit 1; }
          grep -q "git token file not found: data/secrets/github-pat" <<<"$output" \
            || { echo "expected fail-closed message, got: $output"; exit 1; }

name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
          # setup-bun v2 has NO `cache` input (it accepts only bun-version /
          # no-cache); no-cache=false covers just the executable download.
          # The `ci` job fits its 5-min budget without install caching, so
          # nothing further is configured here (issue #70).
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun check
      # Run via the package.json script (not bare `bun test`): the script
      # bounds e2e/journey stub-harness concurrency by running those files
      # serial (--parallel=1) ahead of the parallel unit group, so the
      # harness response windows hold on ANY host (issue #260).
      - run: bun run test

  # Aggregate coverage gate (issue #290): runs the suite WITH coverage as a
  # single serial invocation (--parallel=1) — the e2e/journey harness
  # windows hold by construction (issue #260's concurrency rule: nothing
  # ever runs concurrently with the e2e files) — and fails when the whole-
  # suite "All files" aggregate drops below the 85% lines/functions floor
  # (percent units — the old gate compared bun's 91.34-style output against
  # fractional 0.85 floors and could never fail). A separate job so the
  # fast `ci` job never pays for coverage instrumentation.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check-coverage

  docker:
    runs-on: ubuntu-latest
    # CI-only: docker-compose.yml requires ${SEARXNG_SECRET:?...} so the
    # compose validation / docker-run steps resolve it. This is a dummy
    # validation-only value (a recognizable 64-hex pattern), never a real
    # secret — production substitutes the actual deployment secret.
    env:
      SEARXNG_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      # The real-container lane below drives `bun test` HOST-side against the
      # built image (the host only orchestrates; the container is the
      # boundary), so this job needs the same pinned toolchain as `ci`
      # (#344: without it the step died with `bun: command not found`).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Compose file is valid
        run: docker compose --profile executor config -q

      # Tools image (issues #58/#62/#63): built here in the docker job — NOT
      # in the fast `ci` job — so the default check/test path stays under 5
      # min. The app image builds FROM it, so the tools image MUST come
      # first; the app build then reuses the cached base layers and only
      # adds the bun install + COPY layers. Pushing/pulling a cached build
      # from a registry is a deploy issue (delivery), not this job's
      # concern. Timed so the cold-build delta of the curated set is
      # visible per run (issue #63): the default set is deliberately lean;
      # the heavy layer (Dockerfile.tools-heavy) is per-org opt-in and not
      # built here.
      - name: Build tools image (timed)
        run: |
          start=$(date +%s)
          docker build -f Dockerfile.tools -t bottega-tools:ci .
          echo "tools_image_build_seconds=$(( $(date +%s) - start ))"

      - name: Build app image (inherits the tools base)
        run: docker build -t bottega:ci .

      - name: Tools image ships the curated CLI set v1.1
        run: |
          docker run --rm bottega-tools:ci sh -c '
            gh --version >/dev/null && jq --version >/dev/null && curl --version >/dev/null && git --version >/dev/null &&
            docker --version >/dev/null &&
            node --version >/dev/null && npm --version >/dev/null && pnpm --version >/dev/null && yarn --version >/dev/null &&
            python3 --version >/dev/null && pip3 --version >/dev/null && uv --version >/dev/null &&
            gcc --version >/dev/null && make --version >/dev/null && go version >/dev/null &&
            sqlite3 --version >/dev/null && psql --version >/dev/null &&
            aws --version >/dev/null && glab --version >/dev/null && yq --version >/dev/null && rg --version >/dev/null
          ' && echo "tools image smoke OK"

      - name: Executor image carries the curated CLIs on PATH
        run: |
          docker run --rm bottega:ci sh -c \
            'gh --version && jq --version && curl --version && git --version' \
            >/dev/null

      # Real-container per-job sandbox lane (issue #101/#338): runs the
      # skip-gated real-container runner test against the image built above
      # (the ACTUAL production `docker run` args + image). Treats any printed
      # SKIP as a failure — a silently-skipped security boundary test is the
      # worst outcome, so a skip (no Docker / wrong image) fails this job.
      - name: Real-container sandbox runner (skip = failure)
        run: |
          set +e
          output="$(BOTTEGA_RUN_INTEGRATION=1 BOTTEGA_SANDBOX_IMAGE=bottega:ci bun test src/worker/sandbox-process.test.ts 2>&1)"
          status=$?
          echo "$output"
          if [ "$status" -ne 0 ]; then
            echo "real-container sandbox lane failed (exit $status)" >&2
            exit 1
          fi
          if grep -q "SKIP:" <<<"$output"; then
            echo "real-container sandbox lane skipped — treating as failure" >&2
            exit 1
          fi

      # Per-job sandbox hardening (no skip) — issue #105 profile: the job
      # container joins an INTERNAL-only sandbox network (no WAN route), runs
      # read-only root with a bounded writable /tmp tmpfs, drops ALL
      # capabilities, sets no-new-privileges, and can never route to a raw
      # external IP directly — the iron-proxy allowlist tunnel is the only
      # external seam (exercised separately in the real-container lane below).
      - name: Per-job sandbox hardening (no skip)
        run: |
          set -e
          SANDBOX_NET="bottega-sandbox-ci-$(date +%s)"
          trap 'docker network rm "$SANDBOX_NET" >/dev/null 2>&1 || true' EXIT
          docker network create --internal --subnet 172.31.0.0/24 "$SANDBOX_NET" >/dev/null
          docker run --rm \
            --read-only \
            --init \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 32 \
            --cpus 1 \
            --ulimit nofile=1024 \
            --memory 256m \
            --network "$SANDBOX_NET" \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            bottega:ci sh -ec '
              ! touch /app/rootfs-write
              echo scratch > /tmp/job-write
              test -s /tmp/job-write
              test "$(awk "/^CapEff:/ {print \$2}" /proc/self/status)" = "0000000000000000"
              test "$(awk "/^NoNewPrivs:/ {print \$2}" /proc/self/status)" = "1"
              # seccomp must be FILTERING (active), never disabled. Seccomp:0
              # means the host daemon applied no filter; Seccomp:2 is the
              # normal filter mode. Mode 1 (strict) cannot be reached by a
              # running shell, so "!= 0" rejects exactly the same disabled
              # state as "== 2" while not hard-coding a host-daemon-specific
              # numeric value (the failure on hosts whose default filter
              # reports differently — issue #337).
              test "$(awk "/^Seccomp:/ {print \$2}" /proc/self/status)" != "0"
              ! curl --connect-timeout 2 http://8.8.8.8/ 2>/dev/null
              echo sandbox-hardened-ok
            '
          docker run --rm --init --name bottega-sandbox-teardown bottega:ci \
            sh -c 'sleep 30 &'
          test -z "$(docker ps -aq --filter name=^/bottega-sandbox-teardown$)"

      - name: Server fails closed without Slack tokens
        run: |
          set +e
          output="$(docker run --rm bottega:ci bun run src/server/index.ts 2>&1)"
          status=$?
          echo "$output"
          [ "$status" -ne 0 ] || { echo "expected non-zero exit, got $status"; exit 1; }
          grep -q "SLACK_APP_TOKEN and SLACK_BOT_TOKEN are required" <<<"$output" \
            || { echo "expected fail-closed message, got: $output"; exit 1; }

      - name: Executor fails closed without PAT file
        run: |
          set +e
          output="$(docker run --rm bottega:ci bun run src/executor.ts 2>&1)"
          status=$?
          echo "$output"
          [ "$status" -ne 0 ] || { echo "expected non-zero exit, got $status"; exit 1; }
          grep -q "git token file not found: data/secrets/github-pat" <<<"$output" \
            || { echo "expected fail-closed message, got: $output"; exit 1; }

  # Real iron-proxy integration lane (issue #177, gap #2): runs the
  # skip-gated Docker leg against the pinned image with
  # BOTTEGA_RUN_INTEGRATION=1. NOT part of the default fast `ci` job (the
  # leg skips there with evidence). Treats any printed SKIP as a failure: a
  # silently-skipped security test is the worst outcome, so absence of
  # Docker (or an unpullable image) fails this job instead of passing green.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Iron-proxy integration leg (skip = failure)
        run: |
          set +e
          output="$(BOTTEGA_RUN_INTEGRATION=1 bun test src/egress/iron-proxy.test.ts 2>&1)"
          status=$?
          echo "$output"
          if [ "$status" -ne 0 ]; then
            echo "iron-proxy integration leg failed (exit $status)" >&2
            exit 1
          fi
          if grep -q "SKIP:" <<<"$output"; then
            echo "iron-proxy integration leg skipped — treating as failure" >&2
            exit 1
          fi

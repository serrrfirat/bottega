# Hybrid canary (issue #298): hermetic + live-API + browser layers.
#
# - hermetic  : runs in CI on every commit (tests/e2e/canary-registry.test.ts
#               + canary-multiplayer.test.ts + the rest of the suite).
# - live-api  : NIGHTLY against the real Slack workspace with four fixed QA
#               identities (requester, space approver, member, second member)
#               — real Socket Mode, real model, real per-identity tokens,
#               CI-strict (missing secrets FAIL, never a silent skip).
# - browser   : NIGHTLY real-browser journeys on a DEDICATED SELF-HOSTED
#               runner with two persistent Chrome profiles (runner-local
#               paths, NOT secrets). Preflights both authenticated profiles,
#               uploads screenshots/traces as artifacts, fails loudly.
#
# The live API + browser legs run nightly IN PARALLEL. A red scheduled run
# blocks the next deploy until triaged (release gate, not a merge gate).
# On a failed journey the live job reruns ONCE in isolation to classify a
# flake; the ORIGINAL failure stays release-blocking and the recovered run
# is reported distinctly — a flake never gets silently filed as the pass.
#
# Manual dispatch (workflow_dispatch) supports focused layer / journey / role
# filters for the live leg (--layer / --journey / --role are passed through).
#
# Secrets (repository): SLACK_APP_TOKEN, SLACK_BOT_TOKEN, SLACK_QA_USER_TOKEN,
# SLACK_QA_REQUESTER_TOKEN, SLACK_QA_APPROVER_TOKEN, SLACK_QA_MEMBER_TOKEN,
# SLACK_QA_SECOND_MEMBER_TOKEN (+ their user-id/name envs), SLACK_QA_CHANNEL,
# NEAR_API_KEY / CANARY_MODEL_REF. See features.md → "Live-Slack QA canary".
name: Canary

on:
  schedule:
    # Nightly: 04:00 UTC. The live + browser legs run in parallel.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      layer:
        description: "Layer to focus (live-api | browser)"
        type: choice
        options: ["live-api", "browser"]
        default: "live-api"
      journey:
        description: "A stable journey id to focus (optional)"
        required: false
        type: string
      role:
        description: "A fixed actor to focus (requester | space-approver | member | second-member)"
        required: false
        type: choice
        options: ["", "requester", "space-approver", "member", "second-member"]
        default: ""

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Live-API leg (known infra): ubuntu-latest, the issue #175/#79 semantics,
  # now with the four fixed QA identities for the role/multiplayer matrix.
  # ---------------------------------------------------------------------------
  live-api:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      # CI-strict (--ci): missing secrets fail loudly instead of skipping.
      # The focused layer/journey/role inputs are passed through as filters.
      - name: Run the live-API canary (CI-strict)
        id: canary
        env:
          CI: "true"
          CANARY_CI: "1"
          SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_QA_USER_TOKEN: ${{ secrets.SLACK_QA_USER_TOKEN }}
          SLACK_QA_REQUESTER_TOKEN: ${{ secrets.SLACK_QA_REQUESTER_TOKEN }}
          SLACK_QA_APPROVER_TOKEN: ${{ secrets.SLACK_QA_APPROVER_TOKEN }}
          SLACK_QA_MEMBER_TOKEN: ${{ secrets.SLACK_QA_MEMBER_TOKEN }}
          SLACK_QA_SECOND_MEMBER_TOKEN: ${{ secrets.SLACK_QA_SECOND_MEMBER_TOKEN }}
          SLACK_QA_USER_ID: ${{ secrets.SLACK_QA_USER_ID }}
          SLACK_QA_CHANNEL: ${{ secrets.SLACK_QA_CHANNEL }}
          NEAR_API_KEY: ${{ secrets.NEAR_API_KEY }}
          CANARY_MODEL_REF: ${{ secrets.CANARY_MODEL_REF }}
        run: |
          set -o pipefail
          ARGS="--live-slack --ci"
          if [[ -n "${{ inputs.layer }}" ]]; then ARGS="$ARGS --layer ${{ inputs.layer }}"; fi
          if [[ -n "${{ inputs.journey }}" ]]; then ARGS="$ARGS --journey ${{ inputs.journey }}"; fi
          if [[ -n "${{ inputs.role }}" ]]; then ARGS="$ARGS --role ${{ inputs.role }}"; fi
          bun run canary $ARGS 2>&1 | tee canary-report.txt

      # One ISOLATED rerun on failure (issue #298): classify a flake. The
      # ORIGINAL report is preserved (canary-report.txt) and the rerun's
      # report is written separately — a recovered-on-rerun is reported
      # distinctly; the original red status remains release-blocking. A
      # flake is never silently filed as a pass.
      - name: Isolated rerun to classify a flake (original remains blocking)
        if: failure() && steps.canary.outcome == 'failure'
        env:
          CI: "true"
          CANARY_CI: "1"
          CANARY_RERUN: "1"
          SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_QA_USER_TOKEN: ${{ secrets.SLACK_QA_USER_TOKEN }}
          SLACK_QA_REQUESTER_TOKEN: ${{ secrets.SLACK_QA_REQUESTER_TOKEN }}
          SLACK_QA_APPROVER_TOKEN: ${{ secrets.SLACK_QA_APPROVER_TOKEN }}
          SLACK_QA_MEMBER_TOKEN: ${{ secrets.SLACK_QA_MEMBER_TOKEN }}
          SLACK_QA_SECOND_MEMBER_TOKEN: ${{ secrets.SLACK_QA_SECOND_MEMBER_TOKEN }}
          SLACK_QA_USER_ID: ${{ secrets.SLACK_QA_USER_ID }}
          SLACK_QA_CHANNEL: ${{ secrets.SLACK_QA_CHANNEL }}
          NEAR_API_KEY: ${{ secrets.NEAR_API_KEY }}
          CANARY_MODEL_REF: ${{ secrets.CANARY_MODEL_REF }}
        run: |
          set +e
          bun run canary --live-slack --ci 2>&1 | tee canary-rerun.txt
          echo "rerun_exit=$?" >> "$GITHUB_ENV"

      # Machine-readable status artifact for release automation (issue #298):
      # green + younger than 24h. NOT a merge gate — the scheduled canary is
      # a release gate only; this artifact is what release automation checks.
      - name: Write the machine-readable status artifact
        id: status
        run: |
          if [ -f canary-rerun.txt ]; then RERUN="true"; else RERUN="false"; fi
          STATUS="failed"
          if grep -q "live-slack canary PASSED" canary-report.txt 2>/dev/null; then STATUS="passed"; fi
          # The ORIGINAL verdict drives the release-blocking status; a rerun
          # that recovered (green) is reported distinctly via the rerun flag.
          AT="$(date +%s)000"
          jq -n \
            --arg layer "live-api" \
            --arg status "$STATUS" \
            --arg rerun "$RERUN" \
            --arg at "$AT" \
            '{layer:$layer,status:$status,rerun:$rerun,at:$at}' \
            > canary-status.json
          cat canary-status.json
      - uses: actions/upload-artifact@v4
        with:
          name: canary-live-api-status
          path: |
            canary-status.json
            canary-report.txt
            canary-rerun.txt
          if-no-files-found: ignore

      # Failure notifies loudly (the QA channel gets the per-journey report
      # + permalinks + run URL + layer/actors; see scripts/canary-notify.ts).
      - name: Notify the QA channel on failure
        if: failure() && steps.canary.outcome == 'failure'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_QA_CHANNEL: ${{ secrets.SLACK_QA_CHANNEL }}
        run: bun run scripts/canary-notify.ts canary-report.txt

  # ---------------------------------------------------------------------------
  # Browser leg (issue #298): real Chrome on a DEDICATED SELF-HOSTED runner.
  # ---------------------------------------------------------------------------
  browser:
    runs-on: [self-hosted, linux, x64, canary]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      # Preflight both authenticated profiles (runner-local paths, NOT
      # secrets). The profiles hold the workspace sessions pre-authenticated.
      # A missing/unauthenticated profile fails the job loudly — never a
      # silent skip or a fabricated browser pass.
      - name: Preflight the runner Chrome profiles
        env:
          BROWSER_PROFILE_REQUESTER: ${{ vars.BROWSER_PROFILE_REQUESTER }}
          BROWSER_PROFILE_APPROVER: ${{ vars.BROWSER_PROFILE_APPROVER }}
          BROWSER_APPROVER: ${{ vars.BROWSER_APPROVER }}
        run: |
          set -euo pipefail
          for p in "$BROWSER_PROFILE_REQUESTER" "$BROWSER_PROFILE_APPROVER"; do
            if [[ -z "$p" || ! -d "$p" ]]; then
              echo "::error::browser canary preflight: profile dir '$p' missing — configure the runner-local profile paths (issues/vars.BROWSER_PROFILE_*)"
              exit 1
            fi
            echo "preflight OK: $p"
          done

      # Run the five browser journeys. --layer browser / --journey / --role
      # focus the run when dispatched manually; the runner-local Chrome +
      # workspace URL come from runner vars (never secrets).
      - name: Run the browser canary
        id: browser
        env:
          BROWSER_PROFILE_DIR: ${{ vars.BROWSER_PROFILE_REQUESTER }}
          BROWSER_EVIDENCE_DIR: browser-evidence
          SLACK_WORKSPACE_URL: ${{ vars.SLACK_WORKSPACE_URL }}
        run: |
          ARGS=""
          if [[ -n "${{ inputs.journey }}" ]]; then ARGS="--journey ${{ inputs.journey }}"; fi
          if [[ -n "${{ inputs.role }}" ]]; then ARGS="$ARGS --role ${{ inputs.role }}"; fi
          bun run tests/e2e/browser-canary.ts $ARGS
        continue-on-error: true

      # Upload the evidence (screenshots + traces + status) regardless of
      # result, so a failure is fully diagnosable from the artifacts.
      - uses: actions/upload-artifact@v4
        with:
          name: canary-browser-evidence
          path: browser-evidence/**
          if-no-files-found: ignore

      - name: Fail loudly on any browser journey failure
        if: steps.browser.outcome == 'failure'
        run: |
          echo "::error::browser canary failed — check the uploaded evidence artifacts (screenshots + traces)"
          exit 1